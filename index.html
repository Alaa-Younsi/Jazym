<!doctype html>
<html lang="fr" dir="ltr" data-theme="light">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e0e12" media="(prefers-color-scheme: dark)" />

    <!-- Pre-paint theme + language (see skill Phase 3 / 9.7).
         script-src in vercel.json has NO 'unsafe-inline' — this runs on the
         strength of a sha256 of its EXACT bytes. Editing it by one character
         means recomputing that hash (see scripts/csp-hash.mjs) or dark mode
         flashes on every load in production only. Keep the localStorage keys in
         sync with ThemeProvider.tsx / LanguageProvider.tsx. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("jazym-theme");
          if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
          var l = localStorage.getItem("jazym-lang");
          if (l === "ar" || l === "fr") {
            document.documentElement.lang = l;
            document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
          }
        } catch (e) {}
      })();
    </script>
